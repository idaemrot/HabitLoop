<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="HabitLoop — Build powerful daily habits with streak tracking, insights, and accountability." />
  <meta name="theme-color" content="#D4FF4F" />
  <!-- Fonts — preconnect + <link> instead of a CSS @import, which is
       render-blocking (the browser can't start fetching the imported
       stylesheet until it has fetched and parsed index.css first). This
       lets the font fetch start in parallel with everything else. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet" />
  <!-- Open Graph -->
  <meta property="og:title" content="HabitLoop — Build Unstoppable Habits" />
  <meta property="og:description" content="Track habits, build streaks, and transform your daily routine." />
  <meta property="og:type" content="website" />
  <!-- Favicon placeholder -->
  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23D4FF4F'/><text y='24' x='8' font-size='22' font-weight='bold' font-family='sans-serif' fill='%230F0F0F'>H</text></svg>" />
  <title>HabitLoop — Build Unstoppable Habits</title>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
